  <script id="REPORT_DATA" type="application/json">{"logo":"https://jbzvghsxzbcolmdfiswr.supabase.co/storage/v1/object/public/assets/TC%20-%20LOGO%20NUEVO%20HORIZONTAL%20FONDO%20TRANSPARENTE%20HIGH%20(3).png","empresa":"Empresa Demo","equipo":"Equipo de Operaciones · ejemplo ficticio","fecha":"2026-10-14T19:40:00.000000+00:00","fechaSesion":"2026-10-14T18:30:00Z","marca":null,"publicUrl":"","lang":"es","notasFacilitador":"","participantes":5,"seleccion":false,"clasicoUrl":"","excelUrl":"","markdown":"# Reporte de Procesos de Equipo — TeamCook\n\n- **Empresa:** Empresa Demo\n- **Equipo:** Equipo de Operaciones · ejemplo ficticio\n- **Fecha de la sesión:** 14 de octubre de 2026\n- **Duración:** ~70 minutos\n- **Participantes:** 5 (4 con perfil completo · 1 con evidencia insuficiente)\n- **Modalidad:** Remota\n- **Tipo de assessment:** Observación de sesión\n\n---\n\n## Sobre este reporte\n\n**Ejemplo de demostración.** La empresa, el equipo, las personas, las métricas y las citas de este reporte son ficticios y fueron creados para mostrar el formato. No corresponden a ninguna sesión, organización ni persona real.\n\nLectura observacional de los procesos de equipo durante una sesión de TeamCook, generada con IA sobre el transcript. Combina dos capas: (1) métricas objetivas de interacción computadas por conteo —fiables porque no dependen del juicio del modelo— y (2) seis competencias de procesos de equipo inferidas de la evidencia verbal, ancladas en literatura de teamwork. NO es un test psicométrico validado ni predice desempeño futuro: describe cómo el grupo y cada persona contribuyeron a los procesos colectivos en esta sesión, y en qué agregó valor cada una al equipo. Insumo complementario para decisiones de talento —desarrollo, dinámica de equipo, sucesión, asignación a proyectos o procesos de selección—, nunca criterio único de ninguna decisión.\n\n---\n\n## Resumen ejecutivo\n\n**Cómo funcionó el equipo:** El grupo mostró un reparto de participación muy equitativo (Gini 0.20), con Paula Arteaga como nodo más activo y Sofía Quiroga con participación notablemente menor. La escucha mutua fue alta: las propuestas de una persona eran retomadas y ampliadas por otras sin necesidad de insistencia, y la coordinación se sostuvo en varios nodos a lo largo de las tres partidas.\n\n**Contribuciones que se destacaron:**\n- Paula Arteaga sostuvo la estructuración del equipo en pre-partida y debrief, con análisis causal específico y propuestas accionables (Reflexión y aprendizaje N5 · Liderazgo N4).\n- Rodrigo Lemos aportó dirección operativa durante las partidas activas, ofreció backup espontáneo y sostuvo el tono del equipo bajo presión (Coordinación N4 · Apoyo al equipo N4 · Clima y cohesión N4).\n- Camila Nieva mantuvo el flujo de información con preguntas de chequeo —el ratio de indagación más alto del grupo— y aportó aprendizajes accionables en el debrief (Coordinación N4 · Reflexión y aprendizaje N4).\n- Ignacio Berti ejecutó con fluidez y absorbió los cambios de escenario sin fricción, aunque con baja estructuración verbal (Adaptabilidad N4).\n\n**Principal tensión del sistema:** La participación de Sofía Quiroga fue significativamente menor en volumen y en contenido estructurante, lo que dejó la carga de dirección y síntesis concentrada en los otros cuatro participantes.\n\n**Cómo usar esta lectura:** Esta sesión aporta señales sobre cómo cada persona contribuye a los procesos de equipo bajo presión; debe combinarse con entrevistas, observación del día a día y otros instrumentos, y no es criterio único de ninguna decisión de talento.\n\n---\n\n## Inteligencia Colectiva del equipo\n\n**Distribución de participación:**\n\n| Participante | Turnos de habla | % del grupo |\n|---|---|---|\n| Paula Arteaga | 232 | 29% |\n| Rodrigo Lemos | 200 | 25% |\n| Camila Nieva | 176 | 22% |\n| Ignacio Berti | 120 | 15% |\n| Sofía Quiroga | 72 | 9% |\n| **TOTAL** | **800** | **100%** |\n\n**Equidad de turnos (Gini):** 0.20 — **muy equitativa**. El reparto es razonablemente distribuido entre cuatro participantes; Sofía Quiroga queda por debajo del quinto esperado, lo que inclina levemente la distribución sin llegar a concentración dominante.\n\n**Densidad de coordinación:** Tasa de uptake grupal alta: se identificaron más de 70 turnos con retoma explícita de lo dicho por otro (tasa grupal estimada ~0.09 sobre el total de turnos, con picos marcados en pre-partida y debrief). Nodos más centrales por grado de entrada: Paula Arteaga (retomada por los cuatro compañeros) y Rodrigo Lemos (retomado por Paula, Camila e Ignacio). La red es distribuida, sin un único hub dominante; los arcos fluyen en múltiples direcciones entre los cuatro participantes más activos.\n\n**Fortalezas del grupo como sistema:**\n- **Escucha mutua sostenida:** el equipo construyó sobre las ideas de los demás de forma recurrente a lo largo de las tres partidas; las propuestas de una persona eran retomadas y ampliadas por otra sin necesidad de insistencia.\n- **Aprendizaje iterativo visible:** entre la primera y la tercera partida el equipo incorporó ajustes concretos (cortar en simultáneo para los pedidos triples, liberar el centro antes de emplatar, cantar el pedido en voz alta) que surgieron de la reflexión colectiva en los intervalos.\n- **Coordinación operativa bajo presión:** durante las partidas activas el flujo de información fue fluido, con pedidos nombrados, confirmaciones y redistribución espontánea de tareas ante disrupciones (fuego en la cocina, cambio de lado en la tercera partida).\n\n**Tensiones del grupo como sistema:**\n- **Participación asimétrica:** Sofía Quiroga aportó el 9% de los turnos y escasa estructuración verbal; si esa asimetría se sostiene en contextos reales, la carga de dirección y síntesis recae desproporcionadamente en los demás.\n- **Recurso de pausa no activado:** el equipo no utilizó la pausa disponible en ninguna de las tres partidas, lo que en el debrief fue reconocido como una oportunidad perdida para recalibrar bajo presión.\n- **Definición de roles disuelta temprano:** la propuesta inicial de designar a una persona para cantar los pedidos no se sostuvo en la práctica; el equipo funcionó bien de forma distribuida, pero sin claridad explícita de quién hace qué ante disrupciones.\n\n---\n\n## Comparativa entre participantes\n\n| Participante | Contribución general observada | Competencias más fuertes (nivel) | Síntesis |\n|---|---|---|---|\n| Paula Arteaga | Alta | Reflexión y aprendizaje N5 · Liderazgo N4 · Coordinación N4 | Nodo de síntesis y estructuración: propone, analiza el porqué y cierra el ciclo de aprendizaje con especificidad. |\n| Rodrigo Lemos | Sólida | Coordinación N4 · Apoyo al equipo N4 · Clima y cohesión N4 | Nodo operativo y de clima: dirige el flujo en partida activa, cubre al compañero y sostiene el tono del equipo. |\n| Camila Nieva | Sólida | Coordinación N4 · Reflexión y aprendizaje N4 · Liderazgo N3 | Nodo de sincronización: chequea estado, mantiene el flujo de información y aporta aprendizajes accionables. |\n| Ignacio Berti | Funcional | Adaptabilidad N4 · Apoyo al equipo N3 · Coordinación N3 | Nodo de ejecución: absorbe los cambios de escenario sin fricción, con baja estructuración verbal. |\n| Sofía Quiroga | — (evidencia insuficiente) | — | Requiere una segunda instancia de observación. |\n\n**Nota de interpretación:** este orden refleja el nivel general de contribución a los procesos de equipo observado en ESTA sesión; NO es un ranking de mérito ni un puntaje agregado. Diferencias chicas entre participantes (p. ej. un nivel BARS de distancia en una o dos competencias) NO son diferencias reales de nivel: están dentro del margen del instrumento. Dentro de ese rango, las personas deben considerarse equivalentes en esta observación, y cualquier decisión debe apoyarse en la evidencia cualitativa de cada perfil y en otras instancias.\n\n**Requiere una segunda instancia de observación:** Sofía Quiroga. Esta sesión no produjo evidencia suficiente para evaluar a esta persona; conviene una instancia adicional antes de apoyarse en el reporte respecto de ella. La falta de evidencia no constituye un resultado negativo.\n\n---\n\n## Perfiles individuales\n\n---\n\n### Paula Arteaga\n\n**Métricas objetivas de interacción (computadas por conteo):**\n- Participación: 232 turnos de habla (29% del grupo)\n- Ratio preguntas/afirmaciones: 0.14 (predominantemente aseverativo; pocas preguntas directas, muchas afirmaciones y propuestas)\n- Propuesta/estructuración vs. ejecución: 40 / 60 (actos de propuesta/estructuración concentrados en pre-partida, intervalos y debrief; mayoría de turnos en partida activa son operativos)\n- Uptake: 26 turnos con retoma explícita de lo dicho por otro (tasa 0.11)\n- Centralidad: grado de entrada 4 · grado de salida 4\n\n**Lectura de las métricas:** Alta emisión con perfil predominantemente aseverativo; combina ejecución operativa en partida activa con estructuración y síntesis en los momentos de transición. Sus intervenciones son retomadas por los cuatro compañeros (grado de entrada máximo posible en este grupo), lo que la ubica como el nodo de mayor centralidad en la red de coordinación. El ratio de propuesta es más alto en las fases de mayor peso analítico.\n\n**Competencias de procesos de equipo (nivel BARS · valor ± banda):**\n\n| Competencia | Nivel | Score |\n|---|---|---|\n| Liderazgo | N4 — Contribución fuerte | 75 ± 10 |\n| Coordinación y Comunicación | N4 — Contribución fuerte | 75 ± 10 |\n| Apoyo al equipo | N3 — Contribución funcional | 55 ± 10 |\n| Adaptabilidad | N3 — Contribución funcional | 55 ± 10 |\n| Clima y cohesión | N3 — Contribución funcional | 55 ± 10 |\n| Reflexión y aprendizaje | N5 — Referente del proceso | 92 ± 8 |\n\n**Justificación por competencia:**\n*Liderazgo N4:* Propone estructura en pre-partida (\"Somos cinco: dos cortan, dos cocinan y uno entrega, y el que queda libre se mueve\") y sus propuestas son adoptadas por el grupo; reprioriza en el debrief con criterio específico.\n*Coordinación y Comunicación N4:* Cierra lazos con frecuencia en partida activa (\"Necesito dos tomates acá, Cami\"; \"Listo, va el primero\") y comparte estado de forma proactiva; algunos lazos quedan abiertos en los momentos de mayor caos.\n*Apoyo al equipo N3:* Ofrece soporte puntual (\"Te dejo la cebolla cortada\"; \"Dejame eso a mí\") pero el backup es reactivo más que proactivo; no se observa monitoreo sistemático de la saturación del compañero.\n*Adaptabilidad N3:* Reconoce verbalmente la necesidad de ajustar (\"lo que planeamos no sirve para este tablero\") y se adapta en partida, aunque sin liderar la reorganización ante las disrupciones.\n*Clima y cohesión N3:* Mantiene tono colaborativo sostenido (\"Vamos bien, chicos\"; \"Tranquilos que llegamos\") sin contribución destacada al clima ni gestión activa de tensión.\n*Reflexión y aprendizaje N5:* Cierra el ciclo completo en el debrief: observa (\"se nos juntaron tres platos a medio hacer en el centro\"), conceptualiza el patrón (\"el problema no fue la velocidad, fue que nunca liberábamos el espacio\") y propone experimentación concreta (\"terminemos uno antes de empezar el siguiente, aunque parezca más lento\").\n\n**Contribuciones diferenciadoras (respecto al grupo):**\n- Fue la única participante que en el debrief articuló un análisis causal completo: identificó el problema (platos acumulados en el centro), explicó el mecanismo (pérdida de espacio de trabajo) y propuso el ajuste concreto (terminar una tarea antes de iniciar la siguiente), elevando la reflexión del grupo.\n- Sostuvo la estructuración del equipo en los tres momentos de pre-partida, integrando lo aprendido de una ronda a la siguiente con mayor especificidad que el resto.\n- Mayor volumen de turnos (29%) con centralidad máxima (grado de entrada 4): sus intervenciones fueron retomadas por todos los compañeros, lo que la posiciona como el nodo de mayor influencia en el flujo de información del grupo.\n\n**Proyección de contribución y desarrollo:**\n- **Dónde aporta hoy:** En esta sesión funcionó como el principal nodo de síntesis y estructuración del equipo: integró información, propuso ajustes con criterio y cerró el ciclo de aprendizaje con la mayor especificidad del grupo, anclado en Reflexión y aprendizaje N5 y Liderazgo N4.\n- **Hacia dónde puede crecer:** La palanca más útil es ampliar el monitoreo activo del equipo durante la ejecución —no solo en los momentos de transición— para pasar de una coordinación reactiva a un backup más proactivo que sostenga al compañero antes de que se sature.\n- **Señales compatibles con rol y responsabilidad:** Muestra señales compatibles con roles que requieren síntesis, estructuración de procesos y coordinación de equipos bajo presión —sustentado en Reflexión y aprendizaje N5 · Liderazgo N4 · centralidad de entrada 4/4—. También muestra señales compatibles con roles de referencia metodológica dentro de un equipo, donde conceptualizar lo que ocurre y proponer ajustes concretos es central. No se observó evidencia de gestión de conflicto interpersonal en esta sesión, lo cual no implica ausencia de la capacidad; conviene validarlo en entrevista o en una conversación de desarrollo. (Señal observada en esta sesión; no es una predicción de desempeño futuro ni una etiqueta de \"alto potencial\".)\n\n**Citas textuales:**\n> \"Somos cinco: dos cortan, dos cocinan y uno entrega, y el que queda libre se mueve adonde haga falta. No nos amontonemos todos en el mismo lado.\" *(fase: pre-partida)*\n> \"Necesito dos tomates acá, Cami. Yo sigo con la olla.\" *(fase: partida activa)*\n> \"El problema no fue la velocidad, fue que nunca liberábamos el espacio. Se nos juntaron tres platos a medio hacer en el centro y después no podíamos movernos.\" *(fase: debrief)*\n> \"Terminemos uno antes de empezar el siguiente, aunque parezca más lento. Al final llegás antes.\" *(fase: debrief)*\n\n---\n\n### Rodrigo Lemos\n\n**Métricas objetivas de interacción (computadas por conteo):**\n- Participación: 200 turnos de habla (25% del grupo)\n- Ratio preguntas/afirmaciones: 0.11 (perfil aseverativo con directivas frecuentes; preguntas orientadas a confirmar el estado del equipo)\n- Propuesta/estructuración vs. ejecución: 37 / 63 (alta proporción de actos de propuesta en partida activa, especialmente directivas operativas y reparto de tareas sobre la marcha)\n- Uptake: 21 turnos con retoma explícita de lo dicho por otro (tasa 0.11)\n- Centralidad: grado de entrada 4 · grado de salida 3\n\n**Lectura de las métricas:** Perfil aseverativo con alta proporción de directivas operativas; es el participante con mayor densidad de propuesta relativa a su volumen de turnos durante las partidas activas. Sus intervenciones son retomadas por los cuatro compañeros, lo que lo ubica como co-nodo central junto a Paula Arteaga. El uptake es alto en términos absolutos, coherente con su función de ordenar el flujo durante el juego.\n\n**Competencias de procesos de equipo (nivel BARS · valor ± banda):**\n\n| Competencia | Nivel | Score |\n|---|---|---|\n| Liderazgo | N3 — Contribución funcional | 55 ± 10 |\n| Coordinación y Comunicación | N4 — Contribución fuerte | 75 ± 10 |\n| Apoyo al equipo | N4 — Contribución fuerte | 75 ± 10 |\n| Adaptabilidad | N4 — Contribución fuerte | 75 ± 10 |\n| Clima y cohesión | N4 — Contribución fuerte | 75 ± 10 |\n| Reflexión y aprendizaje | N3 — Contribución funcional | 55 ± 10 |\n\n**Justificación por competencia:**\n*Liderazgo N3:* Propone estructura en pre-partida (\"que uno solo cante los pedidos, si no hablamos los cinco encima\") y asume ese rol, pero la dirección es intermitente y se disuelve en la práctica; sus propuestas son adoptadas puntualmente, no de forma sostenida.\n*Coordinación y Comunicación N4:* Coordina el flujo operativo con frecuencia y eficacia (\"Nacho, dejalo ahí que yo lo llevo\"; \"Va el segundo, no lo toquen\"), cierra lazos en múltiples momentos y comparte estado de forma proactiva durante las partidas.\n*Apoyo al equipo N4:* Ofrece soporte espontáneo en varios momentos (\"Soltá eso, Sofi, yo sigo\"; \"Te cubro el lado de la plancha\"), redistribuye carga y cubre al compañero sin que se lo pidan.\n*Adaptabilidad N4:* Verbaliza y ejecuta la adaptación ante disrupciones (\"cambió el tablero, olvidate del plan, vamos de a uno\") y lo hace sin fricción observable en el cambio de lado y en el fuego de la segunda partida.\n*Clima y cohesión N4:* Sostiene el tono colaborativo bajo presión (\"No pasa nada, va el que sigue\"; \"Vamos que esto lo sacamos\") y contribuye al aliento del equipo de forma recurrente durante las partidas.\n*Reflexión y aprendizaje N3:* Aporta observaciones correctas en el debrief (\"la segunda nos salió mejor porque nos pisábamos menos\") pero se queda en la descripción; no identifica el mecanismo ni propone un ajuste accionable propio.\n\n**Contribuciones diferenciadoras (respecto al grupo):**\n- Fue el participante con mayor contribución al apoyo mutuo durante las partidas activas: ofreció backup espontáneo en múltiples momentos, cubriendo a compañeros sin que se lo solicitaran explícitamente.\n- Sostuvo el clima del equipo bajo presión de forma más consistente que el resto, con aliento verbal recurrente que mantuvo el tono colaborativo incluso en los momentos de mayor caos operativo.\n- Fue quien más explícitamente verbalizó y ejecutó la reorganización ante disrupciones: tanto en el fuego de la segunda partida como en el cambio de lado de la tercera, su intervención reordenó al equipo en pocos turnos.\n\n**Proyección de contribución y desarrollo:**\n- **Dónde aporta hoy:** En esta sesión funcionó como el nodo operativo y de clima del equipo: coordinó el flujo de trabajo durante las partidas, ofreció backup espontáneo y sostuvo el tono colaborativo bajo presión, anclado en Coordinación N4, Apoyo al equipo N4 y Clima y cohesión N4.\n- **Hacia dónde puede crecer:** La palanca más útil es llevar al debrief la misma lectura que aplica en la acción: identifica bien qué pasó, pero se queda en la descripción. Preguntarse por qué pasó y qué cambiar la próxima vez convertiría su experiencia operativa en aprendizaje transferible para el equipo.\n- **Señales compatibles con rol y responsabilidad:** Muestra señales compatibles con roles de coordinación operativa de equipos, especialmente en contextos de alta presión y cambio frecuente —sustentado en Coordinación N4 · Apoyo al equipo N4 · Adaptabilidad N4—. También muestra señales compatibles con roles que requieren sostener el clima y la cohesión como función explícita (referente de equipo, rol de soporte transversal). No se observó evidencia de liderazgo estructurante sostenido en esta sesión; conviene explorar en entrevista cómo asume la dirección cuando el contexto lo requiere de forma más explícita. (Señal observada en esta sesión; no es una predicción de desempeño futuro ni una etiqueta de \"alto potencial\".)\n\n**Citas textuales:**\n> \"Que uno solo cante los pedidos, si no hablamos los cinco encima y no se entiende nada.\" *(fase: pre-partida)*\n> \"Soltá eso, Sofi, yo sigo. Vos andá a la entrega.\" *(fase: partida activa)*\n> \"Cambió el tablero, olvidate del plan. Vamos de a uno, el que está más cerca lo agarra.\" *(fase: partida activa)*\n> \"La segunda nos salió mejor porque nos pisábamos menos.\" *(fase: debrief)*\n\n---\n\n### Camila Nieva\n\n**Métricas objetivas de interacción (computadas por conteo):**\n- Participación: 176 turnos de habla (22% del grupo)\n- Ratio preguntas/afirmaciones: 0.26 (el más alto del grupo; combina afirmaciones con preguntas de chequeo y confirmación de estado)\n- Propuesta/estructuración vs. ejecución: 26 / 74 (perfil predominantemente ejecutivo; propuestas concentradas en pre-partida y debrief)\n- Uptake: 19 turnos con retoma explícita de lo dicho por otro (tasa 0.11)\n- Centralidad: grado de entrada 3 · grado de salida 4\n\n**Lectura de las métricas:** Perfil más indagatorio del grupo (ratio preguntas/afirmaciones más alto), con predominio de ejecución sobre estructuración. Se dirige a los cuatro compañeros y es retomada por tres, lo que la ubica como nodo distribuido de la red con mayor salida que entrada: sincroniza más de lo que es referenciada. La mayor densidad de propuesta se concentra en pre-partida y debrief.\n\n**Competencias de procesos de equipo (nivel BARS · valor ± banda):**\n\n| Competencia | Nivel | Score |\n|---|---|---|\n| Liderazgo | N3 — Contribución funcional | 55 ± 10 |\n| Coordinación y Comunicación | N4 — Contribución fuerte | 75 ± 10 |\n| Apoyo al equipo | N3 — Contribución funcional | 55 ± 10 |\n| Adaptabilidad | N3 — Contribución funcional | 55 ± 10 |\n| Clima y cohesión | N3 — Contribución funcional | 55 ± 10 |\n| Reflexión y aprendizaje | N4 — Contribución fuerte | 75 ± 10 |\n\n**Justificación por competencia:**\n*Liderazgo N3:* Propone organización en pre-partida (\"arranquemos cortando todo lo que sabemos que va a salir seguro\") y aporta criterio para ordenar la secuencia; la dirección es puntual y no se sostiene durante las partidas.\n*Coordinación y Comunicación N4:* Coordina con frecuencia y eficacia durante las partidas (\"¿Qué falta para el tercero?\"; \"Esto va saliendo, prepará la entrega\"), cierra lazos y comparte estado de forma proactiva; el ratio de preguntas más alto del grupo facilita la sincronización sin imponer.\n*Apoyo al equipo N3:* Ofrece soporte puntual (\"Dale, te lo termino yo\"; \"Pasámelo que lo emplato\") pero el backup es reactivo; no se observa monitoreo sistemático de la saturación del compañero.\n*Adaptabilidad N3:* Se adapta funcionalmente al cambio de lado y a las disrupciones sin fricción observable, pero sin liderar ni verbalizar la reorganización; procesa el cambio sin destacar.\n*Clima y cohesión N3:* Mantiene tono colaborativo estable (\"Bien ahí\"; \"Eso, eso\") sin contribución destacada al clima ni gestión activa de tensión.\n*Reflexión y aprendizaje N4:* Aporta reflexión específica y accionable en el debrief (\"lo que más cambió fue que empezamos a avisar antes de movernos\"), con un aprendizaje que el grupo retomó y amplió.\n\n**Contribuciones diferenciadoras (respecto al grupo):**\n- Fue la participante con el ratio de preguntas/afirmaciones más alto del grupo, lo que facilitó la sincronización del equipo: sus chequeos de estado mantuvieron el flujo de información sin imponer dirección.\n- Es la única participante con grado de salida mayor que el de entrada: se dirigió a los cuatro compañeros, incluida Sofía Quiroga, siendo quien más intentó incorporarla al flujo de la partida.\n- En el debrief identificó el aprendizaje de anticipar el movimiento (\"avisar antes de moverse\"), que Paula Arteaga retomó y amplió en su análisis final, mostrando uptake de alta calidad.\n\n**Proyección de contribución y desarrollo:**\n- **Dónde aporta hoy:** En esta sesión funcionó como nodo de sincronización del equipo: mantuvo el flujo de información con preguntas de chequeo, ejecutó con fluidez y aportó reflexión accionable en el debrief, anclado en Coordinación N4 y Reflexión y aprendizaje N4.\n- **Hacia dónde puede crecer:** La palanca más útil es sostener en la ejecución las propuestas que formula en la pre-partida —donde tiene ideas de calidad pero las cede rápido— para que su capacidad de organización se traduzca en dirección más estable durante la acción.\n- **Señales compatibles con rol y responsabilidad:** Muestra señales compatibles con roles de coordinación operativa y de sincronización entre partes de un proceso —sustentado en Coordinación N4 · ratio preguntas/afirmaciones 0.26 · grado de salida 4/4—. También muestra señales compatibles con roles que requieren síntesis reflexiva y propuesta de mejoras de proceso. No se observó evidencia de liderazgo estructurante sostenido en esta sesión; conviene explorar en entrevista cómo asume la dirección cuando el contexto lo requiere de forma explícita. (Señal observada en esta sesión; no es una predicción de desempeño futuro ni una etiqueta de \"alto potencial\".)\n\n**Citas textuales:**\n> \"Arranquemos cortando todo lo que sabemos que va a salir seguro, así después no frenamos.\" *(fase: pre-partida)*\n> \"¿Qué falta para el tercero? Decime y lo busco.\" *(fase: partida activa)*\n> \"Sofi, ¿me pasás lo que tenés ahí? Yo lo emplato.\" *(fase: partida activa)*\n> \"Lo que más cambió fue que empezamos a avisar antes de movernos. En la primera nos chocábamos todo el tiempo.\" *(fase: debrief)*\n\n---\n\n### Ignacio Berti\n\n**Métricas objetivas de interacción (computadas por conteo):**\n- Participación: 120 turnos de habla (15% del grupo)\n- Ratio preguntas/afirmaciones: 0.18 (perfil mixto; afirmaciones breves de estado y preguntas de confirmación puntuales)\n- Propuesta/estructuración vs. ejecución: 18 / 82 (perfil marcadamente ejecutivo; muy pocos actos de propuesta, concentrados en la pre-partida de la tercera partida)\n- Uptake: 9 turnos con retoma explícita de lo dicho por otro (tasa 0.08)\n- Centralidad: grado de entrada 2 · grado de salida 3\n\n**Lectura de las métricas:** Volumen de participación por debajo del promedio del grupo, con un perfil claramente ejecutivo: la proporción de propuesta es la más baja de los cuatro perfiles completos. Se dirige a tres compañeros pero es retomado por dos, lo que lo ubica como nodo periférico de la red de coordinación: recibe dirección más de lo que la emite. El uptake bajo es coherente con un rol de ejecución concentrado en la tarea.\n\n**Competencias de procesos de equipo (nivel BARS · valor ± banda):**\n\n| Competencia | Nivel | Score |\n|---|---|---|\n| Liderazgo | N2 — Contribución incipiente | 35 ± 10 |\n| Coordinación y Comunicación | N3 — Contribución funcional | 55 ± 10 |\n| Apoyo al equipo | N3 — Contribución funcional | 55 ± 10 |\n| Adaptabilidad | N4 — Contribución fuerte | 75 ± 10 |\n| Clima y cohesión | N3 — Contribución funcional | 55 ± 10 |\n| Reflexión y aprendizaje | N3 — Contribución funcional | 55 ± 10 |\n\n**Justificación por competencia:**\n*Liderazgo N2:* Hace una única propuesta de estructura en toda la sesión (\"¿y si esta vez arranco yo con las ollas?\"), que el grupo adopta; fuera de ese momento no estructura ni reprioriza, y la dirección la recibe más de lo que la ejerce.\n*Coordinación y Comunicación N3:* Informa su estado cuando se lo preguntan (\"ya va\"; \"me falta uno\") y responde a los pedidos sin demora, pero rara vez comparte estado de forma proactiva: los lazos los abre el otro.\n*Apoyo al equipo N3:* Ayuda cuando se lo piden y libera su estación para el compañero (\"tomá, agarralo vos\"), pero el backup es siempre a pedido; no se observa iniciativa de cobertura.\n*Adaptabilidad N4:* Absorbe los cambios de escenario sin fricción ni pérdida de ritmo: en el cambio de lado de la tercera partida fue el primero en retomar la tarea, y lo verbaliza (\"da igual de qué lado, es lo mismo\").\n*Clima y cohesión N3:* Mantiene tono cordial y no genera fricción (\"bien ahí\"; \"dale\"), sin contribución destacada al clima ni gestión activa de tensión.\n*Reflexión y aprendizaje N3:* Aporta una observación correcta en el debrief (\"en la tercera ya sabíamos lo que venía\") pero general; no identifica el mecanismo ni propone un ajuste concreto.\n\n**Contribuciones diferenciadoras (respecto al grupo):**\n- Fue el participante que absorbió los cambios de escenario con menor fricción: en el cambio de lado de la tercera partida retomó la tarea antes que el resto, sin pedir aclaraciones ni perder ritmo.\n- Sostuvo un volumen de ejecución constante a lo largo de las tres partidas, sin las caídas de ritmo que se observan en otros perfiles durante los momentos de mayor caos.\n- Su única propuesta de la sesión —pedir arrancar con las ollas en la tercera partida— fue adoptada por el grupo, lo que sugiere que la baja estructuración verbal no responde a falta de criterio.\n\n**Proyección de contribución y desarrollo:**\n- **Dónde aporta hoy:** En esta sesión funcionó como nodo de ejecución confiable: mantuvo un ritmo de trabajo constante, respondió a los pedidos sin demora y absorbió los cambios de escenario mejor que nadie, anclado en Adaptabilidad N4.\n- **Hacia dónde puede crecer:** La palanca más útil es pasar de informar cuando le preguntan a compartir estado por iniciativa propia. Su única propuesta de la sesión fue adoptada por el grupo, lo que sugiere que tiene criterio para aportar: el límite está en cuánto lo verbaliza, no en qué tan bueno es el aporte.\n- **Señales compatibles con rol y responsabilidad:** Muestra señales compatibles con roles de ejecución especializada en contextos de cambio frecuente, donde la capacidad de reacomodarse sin fricción es valiosa —sustentado en Adaptabilidad N4 · ejecución 82%—. No se observó evidencia de estructuración sostenida ni de coordinación proactiva en esta sesión; conviene explorar en una conversación de desarrollo si se trata de un estilo de participación o de una oportunidad de crecimiento todavía no abierta. (Señal observada en esta sesión; no es una predicción de desempeño futuro ni una etiqueta de \"alto potencial\".)\n\n**Citas textuales:**\n> \"¿Y si esta vez arranco yo con las ollas? Les libero la mesa de corte.\" *(fase: pre-partida)*\n> \"Ya va. Me falta uno y entrego.\" *(fase: partida activa)*\n> \"Da igual de qué lado, es lo mismo. Seguí vos ahí.\" *(fase: partida activa)*\n> \"En la tercera ya sabíamos lo que venía, por eso salió más tranquila.\" *(fase: debrief)*\n\n---\n\n### Sofía Quiroga\n\n**Estado:** Evidencia insuficiente — no se generan scores.\n\n| Competencia | Nivel |\n|---|---|\n| Liderazgo | — |\n| Coordinación y Comunicación | — |\n| Apoyo al equipo | — |\n| Adaptabilidad | — |\n| Clima y cohesión | — |\n| Reflexión y aprendizaje | — |\n\nSofía Quiroga registró 72 turnos de habla (9% del grupo), pero la gran mayoría corresponde a intervenciones operativas muy breves (confirmaciones de una o dos palabras, fragmentos de acción) que no alcanzan a mapear con suficiencia a tres o más competencias con al menos dos verbalizaciones citables cada una. Su participación en los momentos de pre-partida y debrief —las fases de mayor peso analítico— fue mínima: en el debrief aportó dos intervenciones breves (\"Sí, la última estuvo mejor\" y \"Me costó el principio, después le agarré la mano\"), insuficientes para inferir un perfil de competencias con la disciplina de evidencia requerida.\n\n> *No se generan scores para este perfil. Esta sesión no produjo evidencia suficiente para evaluar a Sofía Quiroga; requiere una segunda instancia de observación (nueva sesión TeamCook u otro instrumento) antes de apoyarse en este reporte respecto de esta persona. La falta de evidencia NO debe interpretarse como un resultado negativo.*\n\n---\n\n## Recomendaciones y próximos pasos\n\n**Para el desarrollo del equipo:**\n- **Distribuir la carga de síntesis y estructuración:** en esta sesión, la reflexión y la propuesta de ajustes recayeron principalmente en Paula Arteaga. En contextos reales, instalar una práctica de debrief rotativo —donde distintas personas lideren la síntesis— distribuiría esa carga y desarrollaría la competencia en quienes la mostraron de forma más incipiente.\n- **Activar recursos disponibles antes de saturarse:** el equipo no utilizó la pausa en ninguna de las tres partidas, pese a tenerla disponible. Incorporar la práctica de \"levantar la cabeza\" ante el caos —ya sea una pausa formal o una señal acordada— es una palanca concreta para mejorar la toma de decisiones bajo presión.\n- **Clarificar roles ante disrupciones:** la definición de roles se disolvió rápido y el equipo funcionó bien de forma distribuida, pero sin claridad explícita de quién hace qué cuando el escenario cambia. Acordar roles de contingencia antes de la acción reduciría la fricción en los momentos de mayor caos.\n\n**Qué conviene validar:**\n- **Gestión de conflicto interpersonal:** la sesión no generó tensión observable entre participantes (contexto colaborativo, sin competencia entre personas). Conviene explorar en entrevista cómo cada persona maneja el desacuerdo o la presión interpersonal en contextos reales.\n- **Estilo de participación de los perfiles más ejecutivos:** Ignacio Berti mostró criterio en su única propuesta de la sesión pero muy baja estructuración verbal. Conviene explorar si se trata de un estilo de participación o de una oportunidad de desarrollo todavía no abierta.\n- **Sofía Quiroga:** requiere una segunda instancia de observación para poder evaluar sus contribuciones a los procesos de equipo. La evidencia de esta sesión es insuficiente para cualquier inferencia de competencia.\n\n**Personas que requieren una segunda instancia:** Sofía Quiroga (ver perfil de Categoría B).\n\n**Sugerencia de uso:** este reporte describe contribuciones a los procesos de equipo en una sesión; conviene combinarlo con la observación del día a día, con entrevistas y con instrumentos formales. No es criterio único de ninguna decisión ni un ranking de mérito.\n\n---\n\n## Devolución al equipo\n\n**Lo que este grupo hizo bien como equipo:**\n- **Se escucharon de verdad:** las ideas de una persona eran retomadas y ampliadas por las demás de forma recurrente. Nadie habló solo: el equipo construyó sobre lo que decía cada uno, y eso se vio tanto en el juego como en las conversaciones entre partidas.\n- **Aprendieron sobre la marcha:** entre la primera y la tercera partida incorporaron ajustes concretos —cortar en simultáneo los pedidos triples, liberar el centro antes de emplatar, avisar antes de moverse— que surgieron de reflexionar juntos. Eso es aprendizaje de equipo real.\n- **Se sostuvieron bajo presión:** cuando se prendió fuego la cocina o los cambiaron de lado, el equipo no se paralizó ni se reprochó. Se reorganizaron, se avisaron y siguieron. Eso es difícil de lograr, especialmente en un contexto nuevo.\n\n**Lo que el equipo puede trabajar:**\n- **Activar los recursos antes de necesitarlos:** tenían una pausa disponible y no la usaron en ninguna de las tres partidas. En el trabajo real pasa lo mismo: a veces el equipo tiene herramientas o personas que pueden ayudar, pero la vorágine hace que nadie las active. Vale la pena acordar de antemano cuándo y cómo pedir ayuda o frenar un momento.\n- **Dar más espacio a todas las voces:** en esta sesión, la carga de proponer y reflexionar recayó más en algunas personas que en otras. En un equipo real, distribuir esa responsabilidad hace al grupo más resiliente y aprovecha mejor lo que cada uno tiene para aportar.\n\n**Una cosa para probar la próxima vez:** antes de arrancar, acordar en 30 segundos quién hace qué si el escenario cambia —no solo cómo van a empezar, sino qué hace cada uno si algo se rompe. Esa conversación corta puede ahorrar mucho tiempo y fricción cuando llega el caos.\n\n---\n\n## Metodología y consideraciones\n\n**Cómo se generó:** análisis con IA sobre el transcript. Capa 1 (participación, Gini, ratio preguntas/afirmaciones, propuesta vs. ejecución, uptake, centralidad) se computa por conteo. Capa 2 (6 competencias) se infiere con anclajes BARS de 5 niveles, ponderando por fase y validando coherencia con la Capa 1. Fundamentos: Woolley et al. (2010), Bales (1950), Marks/Mathieu/Zaccaro (2001), Salas/Sims/Burke (2005), Marlow et al. (2018), Pulakos et al. (2000), Kolb (1984), Thornton & Rupp (2006).\n\n**Cómo leer las métricas de Capa 1 (objetivas):** *Participación* = cuánto habló cada persona (% de turnos). *Gini de turnos* = qué tan equitativo fue el reparto (0 = todos por igual; 1 = monopolizado por uno). *Ratio preguntas/afirmaciones* = cuánto indaga vs. cuánto afirma. *Propuesta vs. ejecución* = si aporta estructura e ideas o si ejecuta. *Uptake* = cuánto retoman los demás lo que dijo (escucha mutua). *Centralidad* = su lugar en la red de coordinación (grado de entrada = cuánto la referencian; grado de salida = a cuántos se dirige). Son las métricas más fiables del reporte: salen de contar, no de interpretar.\n\n**No es un test psicométrico validado**; complementa, no reemplaza, instrumentos formales. **Contribución, no rasgo:** describe la contribución a los procesos del equipo en esta sesión, no una característica estable ni una predicción futura. **Ausencia de evidencia ≠ evidencia de ausencia:** lo no observado se marca como no observable, no se penaliza. **Solo evidencia verbal:** quien verbaliza poco pero contribuye no-verbalmente puede quedar subestimado. **Complementa decisiones de talento, nunca las reemplaza:** es insumo para desarrollo, dinámica de equipo, sucesión, asignación a proyectos y procesos de selección; debe combinarse con entrevistas, observación del día a día y otros instrumentos. No es criterio único de ninguna decisión ni un ranking de mérito.\n\n---\n\n*Reporte de ejemplo con datos ficticios, generado para mostrar el formato. La versión real se genera con IA a partir del transcript de la sesión. Describe procesos de equipo observados en una sesión; complementa, no reemplaza, evaluaciones formales ni instrumentos psicométricos validados. No es el único criterio de ninguna decisión de talento. TeamCook © 2026.*\n","markdownEn":"# Team Process Report — TeamCook\n\n- **Company:** Demo Company\n- **Team:** Operations Team · fictional example\n- **Session date:** October 14, 2026\n- **Duration:** ~70 minutes\n- **Participants:** 5 (4 with a complete profile · 1 with insufficient evidence)\n- **Mode:** Remote\n- **Assessment type:** Session observation\n\n---\n\n## About this report\n\n**Demonstration example.** The company, the team, the people, the metrics and the quotes in this report are fictional and were created to show the format. They do not correspond to any real session, organization or person.\n\nAn observational reading of team processes during a TeamCook session, generated with AI from the transcript. It combines two layers: (1) objective interaction metrics computed by counting —reliable because they do not depend on the model's judgement— and (2) six team-process competencies inferred from verbal evidence, anchored in the teamwork literature. It is NOT a validated psychometric test and it does not predict future performance: it describes how the group and each person contributed to the collective processes in this session, and what each one added to the team. A complementary input for talent decisions —development, team dynamics, succession, project staffing or selection processes—, never the sole criterion for any decision.\n\n---\n\n## Executive summary\n\n**How the team worked:** The group showed a very even distribution of participation (Gini 0.20), with Paula Arteaga as the most active node and Sofía Quiroga participating notably less. Mutual listening was high: one person's proposals were picked up and extended by others without having to be repeated, and coordination was sustained across several nodes throughout the three rounds.\n\n**Contributions that stood out:**\n- Paula Arteaga sustained the team's structuring in the pre-round and the debrief, with specific causal analysis and actionable proposals (Reflection & learning N5 · Leadership N4).\n- Rodrigo Lemos provided operational direction during the active rounds, offered spontaneous backup and held the team's tone under pressure (Coordination N4 · Team support N4 · Climate N4).\n- Camila Nieva kept information flowing with check-in questions —the highest inquiry ratio in the group— and brought actionable learning to the debrief (Coordination N4 · Reflection N4).\n- Ignacio Berti executed fluidly and absorbed the changes of scenario without friction, though with low verbal structuring (Adaptability N4).\n\n**Main tension of the system:** Sofía Quiroga's participation was significantly lower both in volume and in structuring content, which left the load of direction and synthesis concentrated in the other four participants.\n\n**How to use this reading:** This session provides signals about how each person contributes to team processes under pressure; it should be combined with interviews, day-to-day observation and other instruments, and it is not the sole criterion for any talent decision.\n\n---\n\n## Collective Intelligence of the team\n\n**Participation distribution:**\n\n| Participant | Speaking turns | % of group |\n|---|---|---|\n| Paula Arteaga | 232 | 29% |\n| Rodrigo Lemos | 200 | 25% |\n| Camila Nieva | 176 | 22% |\n| Ignacio Berti | 120 | 15% |\n| Sofía Quiroga | 72 | 9% |\n| **TOTAL** | **800** | **100%** |\n\n**Turn equity (Gini):** 0.20 — **very equitable**. The distribution is reasonably spread across four participants; Sofía Quiroga falls below the expected fifth, which tilts the distribution slightly without reaching dominant concentration.\n\n**Coordination density:** High group uptake: more than 70 turns were identified as explicitly building on what someone else had said (estimated group rate ~0.09 of all turns, with marked peaks in the pre-round and the debrief). Most central nodes by in-degree: Paula Arteaga (picked up by all four teammates) and Rodrigo Lemos (picked up by Paula, Camila and Ignacio). The network is distributed, with no single dominant hub; the arcs flow in multiple directions among the four most active participants.\n\n**Strengths of the group as a system:**\n- **Sustained mutual listening:** the team built on each other's ideas repeatedly across the three rounds; one person's proposals were picked up and extended by another without having to be repeated.\n- **Visible iterative learning:** between the first and the third round the team incorporated concrete adjustments (cutting in parallel for the triple orders, clearing the centre before plating, calling out the order aloud) that emerged from collective reflection in the intervals.\n- **Operational coordination under pressure:** during the active rounds information flowed smoothly, with orders named out loud, confirmations and spontaneous redistribution of tasks when disruptions hit (fire in the kitchen, the side swap in the third round).\n\n**Tensions of the group as a system:**\n- **Asymmetric participation:** Sofía Quiroga contributed 9% of the turns and little verbal structuring; if that asymmetry holds in real contexts, the load of direction and synthesis falls disproportionately on the others.\n- **An available resource left unused:** the team did not use the pause available to them in any of the three rounds, which in the debrief was recognized as a missed opportunity to recalibrate under pressure.\n- **Role definition dissolved early:** the initial proposal to assign one person to call out the orders did not hold in practice; the team worked well in a distributed way, but without explicit clarity about who does what when disruptions hit.\n\n---\n\n## Comparison between participants\n\n| Person | Overall contribution observed | Strongest competencies (level) | Summary |\n|---|---|---|---|\n| Paula Arteaga | High | Reflection & learning N5 · Leadership N4 · Coordination N4 | Node of synthesis and structuring: proposes, analyses the why and closes the learning loop with specificity. |\n| Rodrigo Lemos | Solid | Coordination N4 · Team support N4 · Climate & cohesion N4 | Operational and climate node: directs the flow during active play, covers for teammates and holds the team's tone. |\n| Camila Nieva | Solid | Coordination N4 · Reflection & learning N4 · Leadership N3 | Synchronization node: checks status, keeps information flowing and brings actionable learning. |\n| Ignacio Berti | Functional | Adaptability N4 · Team support N3 · Coordination N3 | Execution node: absorbs changes of scenario without friction, with low verbal structuring. |\n| Sofía Quiroga | — (insufficient evidence) | — | Needs a second round of observation. |\n\n**Note on interpretation:** this order reflects the overall level of contribution to team processes observed in THIS session; it is NOT a ranking of merit nor an aggregate score. Small differences between participants (e.g. one BARS level of distance in one or two competencies) are NOT real differences in level: they fall within the margin of the instrument. Within that range, people should be considered equivalent in this observation, and any decision should rest on the qualitative evidence in each profile and on other instances.\n\n**Needs a second round of observation:** Sofía Quiroga. This session did not produce enough evidence to assess this person; an additional instance is advisable before relying on the report with respect to her. The lack of evidence does not constitute a negative result.\n\n---\n\n## Individual profiles\n\n---\n\n### Paula Arteaga\n\n**Metrics of objective interaction (computed by counting):**\n- Participation: 232 speaking turns (29% of the group)\n- Questions/statements ratio: 0.14 (predominantly assertive; few direct questions, many statements and proposals)\n- Proposal/structuring vs. execution: 40 / 60 (proposal and structuring acts concentrated in the pre-round, the intervals and the debrief; most turns during active play are operational)\n- Uptake: 26 turns explicitly building on what someone else said (rate 0.11)\n- Centrality: in-degree 4 · out-degree 4\n\n**Reading the metrics:** High output with a predominantly assertive profile; she combines operational execution during active play with structuring and synthesis at the transition moments. Her interventions are picked up by all four teammates (the maximum in-degree possible in this group), which places her as the most central node in the coordination network. Her proposal ratio is highest in the phases that carry the most analytical weight.\n\n**Team-process competencies (BARS level · value ± band):**\n\n| Competency | Level | Score |\n|---|---|---|\n| Leadership | N4 — Strong contribution | 75 ± 10 |\n| Coordination & Communication | N4 — Strong contribution | 75 ± 10 |\n| Team support | N3 — Functional contribution | 55 ± 10 |\n| Adaptability | N3 — Functional contribution | 55 ± 10 |\n| Climate & cohesion | N3 — Functional contribution | 55 ± 10 |\n| Reflection & learning | N5 — Process reference | 92 ± 8 |\n\n**Rationale by competency:**\n*Leadership N4:* Proposes structure in the pre-round (\"There are five of us: two cut, two cook and one delivers, and whoever is free moves\") and her proposals are adopted by the group; she re-prioritizes in the debrief with specific criteria.\n*Coordination & Communication N4:* Closes loops frequently during active play (\"I need two tomatoes over here, Cami\"; \"Done, the first one's going out\") and shares status proactively; some loops are left open at the most chaotic moments.\n*Team support N3:* Offers help at specific points (\"I'll leave the onion chopped for you\"; \"Leave that one to me\") but the backup is reactive rather than proactive; no systematic monitoring of a teammate's overload is observed.\n*Adaptability N3:* Verbally recognizes the need to adjust (\"what we planned doesn't work on this board\") and adapts during play, though without leading the reorganization when disruptions hit.\n*Climate & cohesion N3:* Maintains a sustained collaborative tone (\"We're doing fine, everyone\"; \"Easy, we'll make it\") without a standout contribution to the climate or active management of tension.\n*Reflection & learning N5:* Closes the full loop in the debrief: she observes (\"we ended up with three half-finished plates piled in the centre\"), conceptualizes the pattern (\"the problem wasn't speed, it was that we never cleared the space\") and proposes concrete experimentation (\"let's finish one before starting the next, even if it feels slower\").\n\n**Distinctive contributions (relative to the group):**\n- She was the only participant who, in the debrief, articulated a complete causal analysis: she identified the problem (plates piling up in the centre), explained the mechanism (loss of working space) and proposed the concrete adjustment (finish one task before starting the next), lifting the group's reflection.\n- She sustained the team's structuring at all three pre-round moments, integrating what had been learned from one round to the next with more specificity than the rest.\n- Highest volume of turns (29%) with maximum centrality (in-degree 4): her interventions were picked up by every teammate, which positions her as the most influential node in the group's information flow.\n\n**Contribution and development:**\n- **Where she contributes today:** In this session she worked as the team's main node of synthesis and structuring: she integrated information, proposed adjustments with sound criteria and closed the learning loop with the greatest specificity in the group, anchored in Reflection & learning N5 and Leadership N4.\n- **Where she can grow:** The most useful lever is to extend active monitoring of the team during execution —not only at the transition moments— so as to move from reactive coordination to a more proactive backup that supports a teammate before they become overloaded.\n- **Signals compatible with role and responsibility:** She shows signals compatible with roles that require synthesis, process structuring and coordination of teams under pressure —supported by Reflection & learning N5 · Leadership N4 · in-degree 4/4—. She also shows signals compatible with roles of methodological reference within a team, where conceptualizing what is happening and proposing concrete adjustments is central. No evidence of interpersonal conflict management was observed in this session, which does not imply the absence of that capacity; it should be validated in an interview or a development conversation. (A signal observed in this session; it is not a prediction of future performance nor a \"high potential\" label.)\n\n**Quotes:**\n> \"There are five of us: two cut, two cook and one delivers, and whoever is free moves wherever they're needed. Let's not all pile up on the same side.\" *(phase: pre-round)*\n> \"I need two tomatoes over here, Cami. I'll stay on the pot.\" *(phase: active round)*\n> \"The problem wasn't speed, it was that we never cleared the space. We ended up with three half-finished plates piled in the centre and then we couldn't move.\" *(phase: debrief)*\n> \"Let's finish one before starting the next, even if it feels slower. You get there sooner in the end.\" *(phase: debrief)*\n\n---\n\n### Rodrigo Lemos\n\n**Metrics of objective interaction (computed by counting):**\n- Participation: 200 speaking turns (25% of the group)\n- Questions/statements ratio: 0.11 (assertive profile with frequent directives; questions aimed at confirming the team's status)\n- Proposal/structuring vs. execution: 37 / 63 (a high share of proposal acts during active play, especially operational directives and reallocation of tasks on the fly)\n- Uptake: 21 turns explicitly building on what someone else said (rate 0.11)\n- Centrality: in-degree 4 · out-degree 3\n\n**Reading the metrics:** An assertive profile with a high share of operational directives; he is the participant with the greatest density of proposal relative to his volume of turns during the active rounds. His interventions are picked up by all four teammates, which places him as a central co-node alongside Paula Arteaga. His uptake is high in absolute terms, consistent with his function of ordering the flow during play.\n\n**Team-process competencies (BARS level · value ± band):**\n\n| Competency | Level | Score |\n|---|---|---|\n| Leadership | N3 — Functional contribution | 55 ± 10 |\n| Coordination & Communication | N4 — Strong contribution | 75 ± 10 |\n| Team support | N4 — Strong contribution | 75 ± 10 |\n| Adaptability | N4 — Strong contribution | 75 ± 10 |\n| Climate & cohesion | N4 — Strong contribution | 75 ± 10 |\n| Reflection & learning | N3 — Functional contribution | 55 ± 10 |\n\n**Rationale by competency:**\n*Leadership N3:* Proposes structure in the pre-round (\"let just one person call out the orders, otherwise all five of us are talking over each other\") and takes that role on, but the direction is intermittent and dissolves in practice; his proposals are adopted at specific moments rather than sustained.\n*Coordination & Communication N4:* Coordinates the operational flow frequently and effectively (\"Nacho, leave it there, I'll take it\"; \"Second one's going out, don't touch it\"), closes loops at multiple moments and shares status proactively during the rounds.\n*Team support N4:* Offers spontaneous help at several moments (\"Drop that, Sofi, I'll carry on\"; \"I've got the grill side covered for you\"), redistributes load and covers for teammates without being asked.\n*Adaptability N4:* Verbalizes and executes the adaptation when disruptions hit (\"the board changed, forget the plan, let's go one at a time\") and does so with no observable friction in the side swap and in the fire in the second round.\n*Climate & cohesion N4:* Holds the collaborative tone under pressure (\"No big deal, next one's going out\"; \"Come on, we've got this\") and contributes to encouraging the team repeatedly throughout the rounds.\n*Reflection & learning N3:* Brings accurate observations to the debrief (\"the second one went better because we got in each other's way less\") but stops at description; he does not identify the mechanism nor propose an actionable adjustment of his own.\n\n**Distinctive contributions (relative to the group):**\n- He was the participant who contributed most to mutual support during the active rounds: he offered spontaneous backup at multiple moments, covering for teammates without being explicitly asked.\n- He held the team's climate under pressure more consistently than the rest, with recurring verbal encouragement that kept the collaborative tone even at the moments of greatest operational chaos.\n- He was the one who most explicitly verbalized and executed the reorganization when disruptions hit: both in the fire in the second round and in the side swap in the third, his intervention reordered the team within a few turns.\n\n**Contribution and development:**\n- **Where he contributes today:** In this session he worked as the team's operational and climate node: he coordinated the flow of work during the rounds, offered spontaneous backup and held the collaborative tone under pressure, anchored in Coordination N4, Team support N4 and Climate & cohesion N4.\n- **Where he can grow:** The most useful lever is to bring to the debrief the same reading he applies in action: he identifies well what happened, but stops at description. Asking why it happened and what to change next time would turn his operational experience into learning the team can transfer.\n- **Signals compatible with role and responsibility:** He shows signals compatible with roles of operational team coordination, especially in contexts of high pressure and frequent change —supported by Coordination N4 · Team support N4 · Adaptability N4—. He also shows signals compatible with roles that require holding climate and cohesion as an explicit function (team reference, cross-cutting support role). No evidence of sustained structuring leadership was observed in this session; it is worth exploring in an interview how he takes on direction when the context requires it more explicitly. (A signal observed in this session; it is not a prediction of future performance nor a \"high potential\" label.)\n\n**Quotes:**\n> \"Let just one person call out the orders, otherwise all five of us are talking over each other and nobody understands a thing.\" *(phase: pre-round)*\n> \"Drop that, Sofi, I'll carry on. You go to the delivery counter.\" *(phase: active round)*\n> \"The board changed, forget the plan. Let's go one at a time, whoever's closest takes it.\" *(phase: active round)*\n> \"The second one went better because we got in each other's way less.\" *(phase: debrief)*\n\n---\n\n### Camila Nieva\n\n**Metrics of objective interaction (computed by counting):**\n- Participation: 176 speaking turns (22% of the group)\n- Questions/statements ratio: 0.26 (the highest in the group; combines statements with check-in questions and status confirmations)\n- Proposal/structuring vs. execution: 26 / 74 (a predominantly executional profile; proposals concentrated in the pre-round and the debrief)\n- Uptake: 19 turns explicitly building on what someone else said (rate 0.11)\n- Centrality: in-degree 3 · out-degree 4\n\n**Reading the metrics:** The most inquiry-oriented profile in the group (highest questions/statements ratio), with execution predominating over structuring. She addresses all four teammates and is picked up by three, which places her as a distributed node in the network with a higher out-degree than in-degree: she synchronizes more than she is referenced. Her greatest density of proposal is concentrated in the pre-round and the debrief.\n\n**Team-process competencies (BARS level · value ± band):**\n\n| Competency | Level | Score |\n|---|---|---|\n| Leadership | N3 — Functional contribution | 55 ± 10 |\n| Coordination & Communication | N4 — Strong contribution | 75 ± 10 |\n| Team support | N3 — Functional contribution | 55 ± 10 |\n| Adaptability | N3 — Functional contribution | 55 ± 10 |\n| Climate & cohesion | N3 — Functional contribution | 55 ± 10 |\n| Reflection & learning | N4 — Strong contribution | 75 ± 10 |\n\n**Rationale by competency:**\n*Leadership N3:* Proposes organization in the pre-round (\"let's start by cutting everything we know will definitely come up\") and brings sound criteria for ordering the sequence; the direction is occasional and is not sustained during the rounds.\n*Coordination & Communication N4:* Coordinates frequently and effectively during the rounds (\"What's missing for the third one?\"; \"This one's coming along, get the delivery ready\"), closes loops and shares status proactively; the highest question ratio in the group makes synchronization easier without imposing.\n*Team support N3:* Offers help at specific points (\"Go ahead, I'll finish it for you\"; \"Pass it over and I'll plate it\") but the backup is reactive; no systematic monitoring of a teammate's overload is observed.\n*Adaptability N3:* Adapts functionally to the side swap and to the disruptions with no observable friction, but without leading or verbalizing the reorganization; she processes the change without standing out.\n*Climate & cohesion N3:* Maintains a steady collaborative tone (\"Nice one\"; \"That's it, that's it\") without a standout contribution to the climate or active management of tension.\n*Reflection & learning N4:* Brings specific and actionable reflection to the debrief (\"what changed most was that we started calling out before we moved\"), with a learning point the group picked up and extended.\n\n**Distinctive contributions (relative to the group):**\n- She was the participant with the highest questions/statements ratio in the group, which made the team's synchronization easier: her status checks kept information flowing without imposing direction.\n- She is the only participant with a higher out-degree than in-degree: she addressed all four teammates, Sofía Quiroga included, and was the one who most tried to bring her into the flow of play.\n- In the debrief she identified the learning point about anticipating movement (\"calling out before moving\"), which Paula Arteaga picked up and extended in her final analysis, showing high-quality uptake.\n\n**Contribution and development:**\n- **Where she contributes today:** In this session she worked as the team's synchronization node: she kept information flowing with check-in questions, executed fluidly and brought actionable reflection to the debrief, anchored in Coordination N4 and Reflection & learning N4.\n- **Where she can grow:** The most useful lever is to hold during execution the proposals she formulates in the pre-round —where she has good ideas but gives them up quickly— so that her capacity for organization translates into steadier direction during the action.\n- **Signals compatible with role and responsibility:** She shows signals compatible with roles of operational coordination and of synchronization between parts of a process —supported by Coordination N4 · questions/statements ratio 0.26 · out-degree 4/4—. She also shows signals compatible with roles that require reflective synthesis and proposing process improvements. No evidence of sustained structuring leadership was observed in this session; it is worth exploring in an interview how she takes on direction when the context explicitly requires it. (A signal observed in this session; it is not a prediction of future performance nor a \"high potential\" label.)\n\n**Quotes:**\n> \"Let's start by cutting everything we know will definitely come up, so we don't have to stop later.\" *(phase: pre-round)*\n> \"What's missing for the third one? Tell me and I'll get it.\" *(phase: active round)*\n> \"Sofi, can you pass me what you've got there? I'll plate it.\" *(phase: active round)*\n> \"What changed most was that we started calling out before we moved. In the first one we were bumping into each other the whole time.\" *(phase: debrief)*\n\n---\n\n### Ignacio Berti\n\n**Metrics of objective interaction (computed by counting):**\n- Participation: 120 speaking turns (15% of the group)\n- Questions/statements ratio: 0.18 (a mixed profile; brief status statements and occasional confirmation questions)\n- Proposal/structuring vs. execution: 18 / 82 (a markedly executional profile; very few proposal acts, concentrated in the pre-round of the third round)\n- Uptake: 9 turns explicitly building on what someone else said (rate 0.08)\n- Centrality: in-degree 2 · out-degree 3\n\n**Reading the metrics:** A volume of participation below the group average, with a clearly executional profile: his share of proposal is the lowest of the four complete profiles. He addresses three teammates but is picked up by two, which places him as a peripheral node in the coordination network: he receives direction more than he issues it. His low uptake is consistent with an execution role focused on the task.\n\n**Team-process competencies (BARS level · value ± band):**\n\n| Competency | Level | Score |\n|---|---|---|\n| Leadership | N2 — Emerging contribution | 35 ± 10 |\n| Coordination & Communication | N3 — Functional contribution | 55 ± 10 |\n| Team support | N3 — Functional contribution | 55 ± 10 |\n| Adaptability | N4 — Strong contribution | 75 ± 10 |\n| Climate & cohesion | N3 — Functional contribution | 55 ± 10 |\n| Reflection & learning | N3 — Functional contribution | 55 ± 10 |\n\n**Rationale by competency:**\n*Leadership N2:* Makes a single structural proposal in the whole session (\"what if I start on the pots this time?\"), which the group adopts; outside that moment he neither structures nor re-prioritizes, and he receives direction more than he exercises it.\n*Coordination & Communication N3:* Reports his status when asked (\"on its way\"; \"one more to go\") and responds to requests without delay, but rarely shares status proactively: the loops are opened by the other person.\n*Team support N3:* Helps when asked and frees up his station for a teammate (\"here, you take it\"), but the backup is always on request; no initiative to cover for others is observed.\n*Adaptability N4:* Absorbs the changes of scenario with no friction and no loss of rhythm: in the side swap in the third round he was the first to pick the task back up, and he verbalizes it (\"doesn't matter which side, it's the same thing\").\n*Climate & cohesion N3:* Maintains a cordial tone and generates no friction (\"nice one\"; \"go ahead\"), without a standout contribution to the climate or active management of tension.\n*Reflection & learning N3:* Brings an accurate observation to the debrief (\"by the third one we already knew what was coming\") but a general one; he does not identify the mechanism nor propose a concrete adjustment.\n\n**Distinctive contributions (relative to the group):**\n- He was the participant who absorbed the changes of scenario with the least friction: in the side swap in the third round he picked the task back up before the rest, without asking for clarification or losing rhythm.\n- He sustained a constant volume of execution across the three rounds, without the drops in rhythm observed in other profiles at the moments of greatest chaos.\n- His single proposal of the session —asking to start on the pots in the third round— was adopted by the group, which suggests that his low verbal structuring does not stem from a lack of sound judgement.\n\n**Contribution and development:**\n- **Where he contributes today:** In this session he worked as a reliable execution node: he kept a constant work rhythm, responded to requests without delay and absorbed the changes of scenario better than anyone, anchored in Adaptability N4.\n- **Where he can grow:** The most useful lever is to move from reporting when asked to sharing status on his own initiative. His single proposal of the session was adopted by the group, which suggests he has the judgement to contribute: the limit is in how much he puts it into words, not in how good the contribution is.\n- **Signals compatible with role and responsibility:** He shows signals compatible with roles of specialized execution in contexts of frequent change, where the ability to resettle without friction is valuable —supported by Adaptability N4 · execution 82%—. No evidence of sustained structuring or of proactive coordination was observed in this session; it is worth exploring in a development conversation whether this is a style of participation or a growth opportunity that has not yet opened up. (A signal observed in this session; it is not a prediction of future performance nor a \"high potential\" label.)\n\n**Quotes:**\n> \"What if I start on the pots this time? That frees up the cutting board for you.\" *(phase: pre-round)*\n> \"On its way. One more to go and I'll deliver.\" *(phase: active round)*\n> \"Doesn't matter which side, it's the same thing. You carry on there.\" *(phase: active round)*\n> \"By the third one we already knew what was coming, that's why it went more calmly.\" *(phase: debrief)*\n\n---\n\n### Sofía Quiroga\n\n**Status:** Insufficient evidence — no scores are generated.\n\n| Competency | Level |\n|---|---|\n| Leadership | — |\n| Coordination & Communication | — |\n| Team support | — |\n| Adaptability | — |\n| Climate & cohesion | — |\n| Reflection & learning | — |\n\nSofía Quiroga recorded 72 speaking turns (9% of the group), but the vast majority correspond to very brief operational interventions (one- or two-word confirmations, fragments of action) that do not map with sufficiency onto three or more competencies with at least two quotable verbalizations each. Her participation at the pre-round and debrief moments —the phases that carry the most analytical weight— was minimal: in the debrief she offered two brief interventions (\"Yes, the last one was better\" and \"The start was hard for me, then I got the hang of it\"), insufficient to infer a competency profile with the required discipline of evidence.\n\n> *No scores are generated for this profile. This session did not produce enough evidence to assess Sofía Quiroga; a second round of observation (a new TeamCook session or another instrument) is required before relying on this report with respect to this person. The lack of evidence must NOT be interpreted as a negative result.*\n\n---\n\n## Recommendations and next steps\n\n**For team development:**\n- **Distribute the load of synthesis and structuring:** in this session, reflection and the proposing of adjustments fell mainly to Paula Arteaga. In real contexts, installing a practice of rotating debriefs —where different people lead the synthesis— would distribute that load and develop the competency in those who showed it in a more emerging form.\n- **Activate available resources before saturating:** the team did not use the pause in any of the three rounds, despite having it available. Building in the practice of \"looking up\" in the middle of chaos —whether a formal pause or an agreed signal— is a concrete lever for improving decision-making under pressure.\n- **Clarify roles when disruptions hit:** role definition dissolved quickly and the team worked well in a distributed way, but without explicit clarity about who does what when the scenario changes. Agreeing on contingency roles before the action would reduce friction at the moments of greatest chaos.\n\n**What should be validated:**\n- **Interpersonal conflict management:** the session generated no observable tension between participants (a collaborative context, with no competition between people). It is worth exploring in an interview how each person handles disagreement or interpersonal pressure in real contexts.\n- **The style of participation of the more executional profiles:** Ignacio Berti showed sound judgement in his single proposal of the session but very low verbal structuring. It is worth exploring whether this is a style of participation or a development opportunity that has not yet opened up.\n- **Sofía Quiroga:** requires a second round of observation in order to assess her contributions to team processes. The evidence from this session is insufficient for any inference of competency.\n\n**People who require a second instance:** Sofía Quiroga (see the Category B profile).\n\n**Suggested use:** this report describes contributions to team processes in a single session; it is best combined with day-to-day observation, with interviews and with formal instruments. It is not the sole criterion for any decision, nor a ranking of merit.\n\n---\n\n## Feedback to the team\n\n**What this group did well as a team:**\n- **They really listened to each other:** one person's ideas were picked up and extended by the others again and again. Nobody was talking into the void: the team built on what each person said, and that showed up both in the game and in the conversations between rounds.\n- **They learned as they went:** between the first and the third round they incorporated concrete adjustments —cutting the triple orders in parallel, clearing the centre before plating, calling out before moving— that came out of reflecting together. That is real team learning.\n- **They held together under pressure:** when the kitchen caught fire or they were switched to the other side, the team neither froze nor turned on each other. They reorganized, called things out and carried on. That is hard to pull off, especially in an unfamiliar setting.\n\n**What the team can work on:**\n- **Activate resources before you need them:** they had a pause available and did not use it in any of the three rounds. The same thing happens at work: sometimes a team has tools or people who could help, but the rush means nobody reaches for them. It is worth agreeing in advance on when and how to ask for help or stop for a moment.\n- **Make more room for every voice:** in this session, the load of proposing and reflecting fell more on some people than on others. In a real team, distributing that responsibility makes the group more resilient and makes better use of what each person has to offer.\n\n**One thing to try next time:** before you start, take 30 seconds to agree on who does what if the scenario changes —not just how you are going to begin, but what each person does if something breaks. That short conversation can save a lot of time and friction when the chaos arrives.\n\n---\n\n## Methodology and considerations\n\n**How it was generated:** AI analysis of the transcript. Layer 1 (participation, Gini, questions/statements ratio, proposal vs. execution, uptake, centrality) is computed by counting. Layer 2 (6 competencies) is inferred using 5-level BARS anchors, weighting by phase and validating consistency against Layer 1. Foundations: Woolley et al. (2010), Bales (1950), Marks/Mathieu/Zaccaro (2001), Salas/Sims/Burke (2005), Marlow et al. (2018), Pulakos et al. (2000), Kolb (1984), Thornton & Rupp (2006).\n\n**How to read the Layer 1 (objective) metrics:** *Participation* = how much each person spoke (% of turns). *Turn Gini* = how evenly the turns were shared (0 = everyone equally; 1 = monopolized by one person). *Questions/statements ratio* = how much a person inquires vs. how much they assert. *Proposal vs. execution* = whether they bring structure and ideas or whether they execute. *Uptake* = how much the others build on what they said (mutual listening). *Centrality* = their place in the coordination network (in-degree = how much they are referenced; out-degree = how many people they address). These are the most reliable metrics in the report: they come from counting, not from interpreting.\n\n**This is not a validated psychometric test**; it complements, it does not replace, formal instruments. **Contribution, not trait:** it describes the contribution to the team's processes in this session, not a stable characteristic nor a prediction of the future. **Absence of evidence ≠ evidence of absence:** what was not observed is marked as not observable, it is not penalized. **Verbal evidence only:** someone who says little but contributes non-verbally may be underestimated. **It complements talent decisions, it never replaces them:** it is an input for development, team dynamics, succession, project staffing and selection processes; it must be combined with interviews, day-to-day observation and other instruments. It is not the sole criterion for any decision, nor a ranking of merit.\n\n---\n\n*An example report with fictional data, generated to show the format. The real version is generated with AI from the session transcript. It describes team processes observed in a single session; it complements, it does not replace, formal evaluations or validated psychometric instruments. It is not the sole criterion for any talent decision. TeamCook © 2026.*\n","empresaEn":"Demo Company","equipoEn":"Operations Team · fictional example"}</script>
